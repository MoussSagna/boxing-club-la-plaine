    <meta name="theme-color" content="#0A0A0A" />

    <!--
      Métadonnées par défaut (lues par les robots qui n'exécutent pas le JS).
      Le hook usePageMeta les met à jour page par page côté client.
      Valeurs à garder synchronisées avec src/data/site.ts.
    -->
    <title>Boxing Club de la Plaine — Club de boxe à Paris 15</title>
    <meta
      name="description"
      content="Boxing Club de la Plaine, club de boxe à Paris 15. Boxe loisir, compétition, boxe éducative et baby boxe. La boxe, sans compromis."

    <link rel="canonical" href="https://www.boxingclubdelaplaine.com/" />

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Boxing Club de la Plaine" />

      property="og:description"
      content="Boxing Club de la Plaine, club de boxe à Paris 15. Boxe loisir, compétition, boxe éducative et baby boxe. La boxe, sans compromis."
    />
    <meta property="og:url" content="https://www.boxingclubdelaplaine.com/" />
    <!-- TODO : remplacer par une image sociale dédiée 1200×630. -->
    <meta
      property="og:image"
      content="https://www.boxingclubdelaplaine.com/assets/logo/logo-dark-512.png"
    />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

        "sport": "Boxing"

  </head>
